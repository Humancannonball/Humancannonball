<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Mark Mikula — Cloud security and platform engineering</title>
  <desc id="desc">An ivory and amber banner with a geometric architectural motif. Secure systems. Useful software.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#252b2b" stroke-opacity=".055"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="280" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="#f4f1e9"/>
    <rect x="700" width="300" height="280" fill="url(#grid)"/>
    <path d="M700 0V280" stroke="#d8d5cd"/>
    <rect x="40" y="38" width="26" height="4" rx="2" fill="#b66817"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <text x="78" y="45" fill="#596260" font-size="13" letter-spacing="2">SECURE SYSTEMS / USEFUL SOFTWARE</text>
      <text x="40" y="127" fill="#1b2523" font-size="66" font-weight="700" letter-spacing="-3">Mark Mikula.</text>
      <text x="43" y="171" fill="#485551" font-size="23">Cloud security &amp; platform engineering</text>
      <path d="M42 204H649" stroke="#d8d5cd"/>
      <text x="43" y="241" fill="#656d67" font-size="15">VILNIUS, LT</text>
      <text x="375" y="241" fill="#656d67" font-size="15">INFRASTRUCTURE · AI · DESKTOP</text>
    </g>
    <g transform="translate(748 36)" fill="none" stroke-width="1.5">
      <rect x="40" y="0" width="150" height="150" rx="20" stroke="#c9c9bc"/>
      <rect x="20" y="28" width="150" height="150" rx="20" fill="#eae6d9" stroke="#bfc3b4"/>
      <rect x="0" y="56" width="150" height="150" rx="20" fill="#263e36" stroke="#263e36"/>
      <path d="M35 102H116M35 130H92M35 158H105" stroke="#e9ede1" stroke-width="6" stroke-linecap="round"/>
      <circle cx="147" cy="185" r="27" fill="#d9903b" stroke="#f4f1e9" stroke-width="6"/>
      <path d="M137 185L144 192L157 178" stroke="#263e36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
